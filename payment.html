<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Payment QR</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
/* 🔹 SAME CSS AS YOU SENT (UNCHANGED) */
:root{
  --bg:#000508; --panel:rgba(5,12,20,.96);
  --g:#00ff88; --b:#00ccff; --y:#ffd700;
  --txt:#c0e0ff; --mono:'Share Tech Mono', monospace;
  --head:'Orbitron', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 500px at 50% 0%, rgba(0,204,255,.15), transparent 60%),
    radial-gradient(700px 400px at 20% 30%, rgba(0,255,136,.12), transparent 55%),
    var(--bg);
  color:var(--txt);
  font-family:Rajdhani;
  display:flex;align-items:center;justify-content:center;padding:16px;
}
.card{
  width:min(520px,100%);
  background:var(--panel);
  border:1px solid rgba(0,204,255,.3);
  border-radius:18px;
  box-shadow:0 22px 70px rgba(0,0,0,.65);
}
.header{padding:16px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center;}
.header h1{
  font-family:var(--head);
  background:linear-gradient(90deg,var(--g),var(--b));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
.header p{font-family:var(--mono);font-size:11px;color:#aaa}
.content{padding:16px}
.qr-wrap{background:#fff;border:2px solid var(--b);border-radius:16px;padding:12px}
.qr-box{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.qr-box img{width:100%;height:100%;object-fit:contain}
label{margin-top:18px;display:block;font-family:var(--mono);color:var(--b)}
input{
  width:100%;margin-top:8px;padding:14px;
  background:#000;color:#fff;border-radius:12px;border:1px solid var(--b)
}
button{
  width:100%;margin-top:18px;padding:15px;
  border-radius:16px;border:1px solid var(--g);
  background:rgba(0,255,136,.12);color:var(--g);
  font-family:var(--head);cursor:pointer;
}
.status{
  margin-top:16px;padding:14px;border-radius:14px;
  border:1px dashed var(--y);color:var(--y);
  text-align:center;font-family:var(--mono);
}
.support{
  margin-top:12px;text-align:center;
}
.support a{
  color:var(--b);font-family:var(--mono);font-size:12px;
  text-decoration:none;
}
</style>
</head>

<body>

<div style="position:fixed;top:12px;right:12px;z-index:999">
  <button onclick="history.back()"
    style="padding:8px 14px;border-radius:20px;
    border:1px solid #ffd700;background:transparent;
    color:#ffd700;cursor:pointer;">
    ⬅ Back
  </button>
</div>
<div class="card">
  <div class="header">
    <h1>PAYMENT PORTAL</h1>
    <p>Scan QR • Pay • Submit UTR</p>
  </div>

  <div class="content">

    <div class="qr-wrap">
      <div class="qr-box">
        <img src="https://img.sanishtech.com/u/b1c2a35ae65be246fa0cd267928b8c5a.png">
      </div>
    </div>

    <label>UTR / Transaction ID</label>
    <input id="utr" placeholder="Enter 12-digit UTR" maxlength="12">

    <button onclick="submitUTR()"<script>
function submitUTR(){
  const utr = document.getElementById("utr").value.trim();
  if(utr.length < 10){
    alert("Please enter valid UTR");
    return;
  }

  localStorage.setItem("payment_status","pending");

  document.getElementById("statusBox").innerHTML =
    "PLEASE WAIT FOR ADMIN APPROVAL<br>(2–5 MINUTES)";

  // demo flow: prediction page
  setTimeout(()=>{
    window.location.href = "prediction.html";
  }, 1200);
}
</script>
function submitUTR(){
  const utr = document.getElementById("utr").value.trim();
  if(utr.length < 10){
    alert("Please enter valid UTR");
    return;
  }

  localStorage.setItem("payment_status","pending");

  document.getElementById("statusBox").innerHTML =
    "PLEASE WAIT FOR ADMIN APPROVAL<br>(2–5 MINUTES)";
}
</script>

</body>
</html>
